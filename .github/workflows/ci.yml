name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, lint (privacy bans), unit + worker + config + CSP tests, build, bundle scan.
      # Tests never touch the network: tests/setup-no-network.ts makes fetch throw.
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm headers:local
