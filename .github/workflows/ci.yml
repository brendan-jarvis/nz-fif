name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Node is still needed under the hood: Wrangler 4, Vite and Playwright run on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # typecheck, lint (privacy bans), unit + worker + config + CSP tests, build, bundle scan.
      # Tests never touch the network: tests/setup-no-network.ts makes fetch throw.
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - run: bun run headers:local
